spring:
  application:
    name: matching-service

  datasource:
    url: ${MATCHING_DB_URL:jdbc:postgresql://localhost:5432/pulseride_matching}
    username: ${MATCHING_DB_USERNAME:postgres}
    password: ${MATCHING_DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8085
  servlet:
    context-path: /pulse-ride

jwt:
  secret: ${JWT_SECRET:ca3ae9dc7984009cfa286be0ffeabd5e78b0620e51fbf7f1f40c1811ca08b781}
  issuer: ${JWT_ISSUER:pulseride-auth}

services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8081/pulse-ride}

  driver:
    url: ${DRIVER_SERVICE_URL:http://localhost:8083/pulse-ride}

  tracking:
    url: ${TRACKING_SERVICE_URL:http://localhost:8082/pulse-ride}

  ride:
    url: ${RIDE_SERVICE_URL:http://localhost:8084/pulse-ride}

matching:
  search-radius-km: ${MATCHING_SEARCH_RADIUS_KM:5.0}
  max-candidates: ${MATCHING_MAX_CANDIDATES:10}
  candidate-stale-seconds: ${MATCHING_CANDIDATE_STALE_SECONDS:30}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info

