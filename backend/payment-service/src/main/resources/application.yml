spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/pulseride_payment}
    username: ${PAYMENT_DB_USERNAME:postgres}
    password: ${PAYMENT_DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${PAYMENT_JPA_DDL_AUTO:update}
    open-in-view: false
server:
  port: ${PAYMENT_SERVICE_PORT:8087}
payment:
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:pulseride-auth}
