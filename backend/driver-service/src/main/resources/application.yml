spring:
  application:
    name: driver-service
  datasource:
    url: ${DRIVER_DB_URL:jdbc:postgresql://localhost:5432/pulseride_driver}
    username: ${DRIVER_DB_USERNAME:postgres}
    password: ${DRIVER_DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DRIVER_JPA_DDL_AUTO:update}
