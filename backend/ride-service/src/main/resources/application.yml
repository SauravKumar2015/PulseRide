spring:
  application:
    name: ride-service
  datasource:
    url: ${RIDE_DB_URL:jdbc:postgresql://localhost:5432/pulseride_ride}
    username: ${RIDE_DB_USERNAME:postgres}
    password: ${RIDE_DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${RIDE_JPA_DDL_AUTO:update}
    open-in-view: false
server:
  port: ${RIDE_SERVICE_PORT:8084}
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:pulseride-auth}
