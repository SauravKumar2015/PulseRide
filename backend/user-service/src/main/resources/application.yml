spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/pulseride_user}
    username: ${USER_DB_USERNAME:postgres}
    password: ${USER_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
server:
  port: ${USER_SERVICE_PORT:8082}
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:pulseride-auth}
