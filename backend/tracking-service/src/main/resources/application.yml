spring:
  application:
    name: tracking-service
  datasource:
    url: ${TRACKING_DB_URL:jdbc:postgresql://localhost:5432/pulseride_tracking}
    username: ${TRACKING_DB_USERNAME:postgres}
    password: ${TRACKING_DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${TRACKING_JPA_DDL_AUTO:update}
    open-in-view: false
server:
  port: ${TRACKING_SERVICE_PORT:8085}
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:pulseride-auth}
