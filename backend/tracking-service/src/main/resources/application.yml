spring:
  application:
    name: tracking-service

  datasource:
    url: ${TRACKING_DB_URL:jdbc:postgresql://localhost:5432/pulseride_tracking}
    username: ${TRACKING_DB_USERNAME:postgres}
    password: ${TRACKING_DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${TRACKING_JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${TRACKING_SERVICE_PORT:8082}

  servlet:
    context-path: /pulse-ride

jwt:
  secret: ${JWT_SECRET:ca3ae9dc7984009cfa286be0ffeabd5e78b0620e51fbf7f1f40c1811ca08b781}
  issuer: ${JWT_ISSUER:pulseride-auth}

services:
  driver:
    url: ${DRIVER_SERVICE_URL:http://localhost:8083}

  ride:
    url: ${RIDE_SERVICE_URL:http://localhost:8084}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}