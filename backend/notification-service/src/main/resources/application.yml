spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/pulseride_notification}
    username: ${NOTIFICATION_DB_USERNAME:postgres}
    password: ${NOTIFICATION_DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${NOTIFICATION_JPA_DDL_AUTO:update}
    open-in-view: false
server:
  port: ${NOTIFICATION_SERVICE_PORT:8088}
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:pulseride-auth}
