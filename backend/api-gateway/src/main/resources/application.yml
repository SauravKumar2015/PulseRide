spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
server:
  port: ${GATEWAY_PORT:8080}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
services:
  driver-url: ${DRIVER_SERVICE_URL:http://localhost:8083}
