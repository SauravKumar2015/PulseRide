spring:
  application:
    name: admin-service
  datasource:
    url: ${ADMIN_DB_URL:jdbc:postgresql://localhost:5432/pulseride_admin}
    username: ${ADMIN_DB_USERNAME:postgres}
    password: ${ADMIN_DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${ADMIN_JPA_DDL_AUTO:update}
    open-in-view: false
server:
  port: ${ADMIN_SERVICE_PORT:8089}
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:pulseride-auth}
