spring:
  application:
    name: auth-service

  # PostgreSQL database configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/pulseride_auth
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081